<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Glasswork — Liquid Glass Material Playground</title>
  <meta name="description" content="Lumno's liquid glass material, open and tunable: tint, opacity, blur, a refracting thick rim with color split, rim light and ink that adapts to the wallpaper behind it.">
  <meta name="theme-color" content="#0b0c0e">
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <meta property="og:title" content="Glasswork — Liquid Glass Material Playground">
  <meta property="og:description" content="Lumno's liquid glass material, open and tunable: tint, blur, a refracting thick rim with color split, and ink that adapts to the wallpaper.">
  <meta property="og:image" content="https://www.kubai.design/glasswork/media/og.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Glasswork: a pane of liquid glass bending the crests of a dune wallpaper">
  <meta property="og:url" content="https://www.kubai.design/glasswork/">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="https://www.kubai.design/glasswork/media/og.jpg">
  <!-- Until the stylesheets arrive, or if one doesn't: the wallpaper covers
       the window instead of showing at its own size and pushing the page
       off screen. -->
  <style>
    html, body { height: 100%; margin: 0; overflow: hidden; background: #0b0c0e; }
    .view, .stage, .wall { position: fixed; inset: 0; }
    .wall > * { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    .wall .is-dark { opacity: 0; }
  </style>
  <!-- A flaky network can drop a file: a stylesheet that fails is asked for
       once more, and if the page's script hasn't started after a while,
       the page reloads once. -->
  <script>
    // Safari and every browser on iOS (WebKit) draw the glass a little
    // differently (glass.css); marked before the first paint.
    (function () {
      var ua = navigator.userAgent;
      var ios = /iP(hone|ad|od)/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
      if (ios || (/AppleWebKit/.test(ua) && !/Chrome|Chromium|Edg/.test(ua))) document.documentElement.dataset.engine = 'webkit';
    })();
    // Errors from the start, for ?debug=1 (debug.js).
    window.__errors = [];
    addEventListener('error', function (e) { window.__errors.push((e.message || 'resource ' + (e.target && (e.target.src || e.target.href))) + (e.filename ? ' @' + e.filename.split('/').pop() + ':' + e.lineno : '')); }, true);
    addEventListener('unhandledrejection', function (e) { window.__errors.push('rejection ' + (e.reason && e.reason.message || e.reason)); });
    function retryStyle(link) {
      if (link.dataset.retried) return;
      var again = link.cloneNode();
      again.dataset.retried = '1';
      again.href = link.href.split('?')[0] + '?retry=' + Date.now();
      link.after(again);
    }
    setTimeout(function () {
      if (document.documentElement.dataset.ready) return;
      try {
        if (sessionStorage.getItem('glasswork:reloaded')) return;
        sessionStorage.setItem('glasswork:reloaded', '1');
      } catch (e) { return; }
      location.reload();
    }, 9000);
  </script>
  <link rel="stylesheet" href="./style.css" onerror="retryStyle(this)">
  <link rel="stylesheet" href="./glass.css" onerror="retryStyle(this)">
</head>
<body>
  <main class="view">
    <div class="stage" data-theme="light">
      <!-- The wallpaper: macOS Tahoe's dynamic one (Apple's, not covered by this project's license), a scene
           drawn live (wallpapers.js), or one of your own. -->
      <div class="wall">
        <video class="is-light" src="./media/tahoe-light.mp4" poster="./media/tahoe-light.webp" muted playsinline loop preload="none"></video>
        <video class="is-dark" src="./media/tahoe-dark.mp4" poster="./media/tahoe-dark.webp" muted playsinline loop preload="none"></video>
      </div>

      <!-- Shown while a wallpaper loads, and who made the wallpaper. -->
      <div class="notice" role="status" aria-live="polite" hidden><i aria-hidden="true"></i><span></span></div>
      <a class="credit" target="_blank" rel="noopener" hidden></a>

      <!-- The glass. Drag any surface over the wallpaper. -->
      <div class="surfaces">
        <div class="search glass" data-surface="search">
          <svg class="ink" viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.5 15.5 5 5"/></svg>
          <input class="ink" type="text" placeholder="Search or enter address" aria-label="Search" data-i18n-placeholder>
          <kbd class="ink-2">⌘K</kbd>
        </div>

        <article class="player glass" data-surface="player">
          <div class="p-top">
            <i class="p-art" aria-hidden="true"></i>
            <span class="p-track"><b class="ink">Glass Hours</b><span class="ink-2">The Lumno Band</span></span>
          </div>
          <div class="p-time ink-2"><span data-time="now">0:00</span><span data-time="left">-0:00</span></div>
          <i class="p-progress"><i class="p-fill"></i></i>
          <div class="p-controls">
            <button type="button" class="p-side ink" data-action="back" aria-label="Back 5 seconds">
              <svg viewBox="0 0 24 24"><path d="M19 5.5v13l-9-6.5zM5 5.5h2.6v13H5z" class="fill"/></svg>
            </button>
            <button type="button" class="p-main ink" data-action="play" aria-label="Play or pause the wallpaper">
              <svg class="is-pause" viewBox="0 0 24 24"><path d="M6.5 5h3.6v14H6.5zM13.9 5h3.6v14h-3.6z" class="fill"/></svg>
              <svg class="is-play" viewBox="0 0 24 24"><path d="M7 4.8v14.4L19 12z" class="fill"/></svg>
            </button>
            <button type="button" class="p-side ink" data-action="forward" aria-label="Forward 5 seconds">
              <svg viewBox="0 0 24 24"><path d="M5 5.5v13l9-6.5zM16.4 5.5H19v13h-2.6z" class="fill"/></svg>
            </button>
          </div>
        </article>

        <!-- The tint's opacity for the current theme, the same as the panel's. -->
        <div class="tint glass" data-surface="tint">
          <span class="tint-label ink" data-i18n>Tint</span>
          <input class="tint-range" type="range" min="0" max="150" step="1" value="100" aria-label="Tint opacity">
          <b class="tint-value ink"></b>
        </div>

      </div>

      <!-- The page's controls, along the bottom. Their tips come from playground.js. -->
      <nav class="toolbar glass" data-surface="toolbar">
        <button type="button" data-action="theme" data-tip-key="Light / dark" data-key="T">
          <svg class="ink sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6 7 7M17 17l1.4 1.4M5.6 18.4 7 17M17 7l1.4-1.4"/></svg>
          <svg class="ink moon" viewBox="0 0 24 24"><path d="M19.5 14.5A7.5 7.5 0 0 1 9.5 4.5a7.5 7.5 0 1 0 10 10z"/></svg>
        </button>
        <button type="button" data-action="wallpaper" data-tip-key="Next wallpaper" data-key="W">
          <svg class="ink" viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="14" rx="3.5"/><path d="m3.8 16.2 4.7-4.7 4 4 2.4-2.4 5.3 5.1"/><circle cx="15.5" cy="9.5" r="1.4"/></svg>
        </button>
        <button type="button" data-action="play" data-tip-key="Pause wallpaper" data-key="Space">
          <svg class="ink is-pause" viewBox="0 0 24 24"><path d="M8.5 6v12M15.5 6v12"/></svg>
          <svg class="ink is-play" viewBox="0 0 24 24"><path d="M8 5.8v12.4L18 12z"/></svg>
        </button>
        <i class="sep" aria-hidden="true"></i>
        <button type="button" data-action="lens" data-tip-key="Refraction" aria-pressed="true">
          <svg class="ink" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M8.2 9.4a4.6 4.6 0 0 1 3.2-2.6"/><path class="off" d="M4.5 4.5l15 15"/></svg>
        </button>
        <button type="button" data-action="code" data-tip-key="Copy CSS">
          <svg class="ink" viewBox="0 0 24 24"><path d="m8.5 7.5-5 4.5 5 4.5M15.5 7.5l5 4.5-5 4.5"/></svg>
        </button>
        <button type="button" data-action="panel" data-tip-key="Settings" data-key="H">
          <svg class="ink" viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>
        </button>
        <i class="sep" aria-hidden="true"></i>
        <a href="https://github.com/kubai087/glasswork" target="_blank" rel="noopener" data-tip-key="Source on GitHub">
          <svg class="ink" viewBox="0 0 16 16"><path class="fill" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0 0 16 8c0-4.42-3.58-8-8-8z"/></svg>
        </a>
      </nav>
    </div>
  </main>

  <!-- Settings (Tweakpane). H hides it, T switches the theme, W the wallpaper, Space pauses it. -->
  <aside class="sidebar"><p class="sidebar-loading">Loading settings…</p></aside>

  <!-- The material as CSS, for your own components. -->
  <dialog class="code-dialog">
    <header>
      <b data-i18n>Copy CSS</b>
      <span class="code-note" data-i18n>The material at the settings you see now. The lens needs lens.js, from this repository.</span>
    </header>
    <pre><code></code></pre>
    <footer>
      <button type="button" data-action="copy" data-i18n>Copy</button>
      <button type="button" data-action="close" data-i18n>Close</button>
    </footer>
  </dialog>

  <script type="module" src="./playground.js"></script>
  <!-- ?debug=1: a panel for checking the page on a phone. Loaded from here,
       fresh each time, so a cached copy of the page's scripts can't keep it
       out. -->
  <script>
    if (/[?&]debug\b/.test(location.search)) {
      var debug = document.createElement('script');
      debug.type = 'module';
      debug.src = './debug.js?v=' + Date.now();
      document.body.append(debug);
    }
  </script>
</body>
</html>
